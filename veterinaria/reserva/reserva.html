<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar Cita - VetCare</title>
    <link rel="stylesheet" href="style-reserva.css">
</head>
<body>
    <div class="form-container">
        <h1>Reservar una Cita</h1>
        <form action="#" method="POST">
            <label for="nombre">Nombre del dueño:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" required>

            <label for="nombre-mascota">Nombre de la mascota:</label>
            <input type="text" id="nombre-mascota" name="nombre_mascota" required>

            <label for="tipo-mascota">Tipo de mascota:</label>
            <input type="text" id="tipo-mascota" name="tipo_mascota" required>

            <label for="fecha">Fecha de la cita:</label>
            <input type="date" id="fecha" name="fecha" required>

            <label for="hora">Hora de la cita:</label>
            <input type="time" id="hora" name="hora" required>

            <label for="detalles">Detalles adicionales:</label>
            <textarea id="detalles" name="detalles" rows="4"></textarea>

            <button type="submit">Confirmar Reserva</button>
        </form>
    </div>

    <!-- Vínculo con tu archivo de JavaScript -->
    <script src="script.js"></script>
</body>
</html>
