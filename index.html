<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar Cita - VetCare</title>
    <link rel="stylesheet" href="style-reserva.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Botón para Volver al Inicio -->
    <div style="max-width: 600px; margin: 20px auto 0 auto; padding: 0 20px;">
        <a href="index.html" class="btn-volver-inicio" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; background: #ffffff; color: #0d9488; padding: 10px 20px; border-radius: 30px; font-weight: 600; font-family: 'Poppins', sans-serif; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: background 0.3s ease;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Volver al Inicio
        </a>
    </div>

    <div class="form-container">
        <h1>Reservar una Cita</h1>
        <!-- Formulario configurado para enviar datos a tu hoja de cálculo -->
        <form action="https://docs.google.com/spreadsheets/d/157NHpFcvEeqprsYAyFp6iUqc6c7HgRTj0xbi03-IeEc/edit?usp=sharing" method="POST">
            
            <label for="nombre">Nombre del dueño:</label>
            <input type="text" id="nombre" name="nombreDueno" required>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="correo" required>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" required>

            <label for="nombre-mascota">Nombre de la mascota:</label>
            <input type="text" id="nombre-mascota" name="nombreMascota" required>

            <label for="tipo-mascota">Tipo de mascota:</label>
            <input type="text" id="tipo-mascota" name="tipoMascota" required>

            <label for="fecha">Fecha de la cita:</label>
            <input type="date" id="fecha" name="fechaCita" required>

            <label for="hora">Hora de la cita:</label>
            <input type="time" id="hora" name="horaCita" required>

            <label for="detalles">Detalles adicionales:</label>
            <textarea id="detalles" name="detalleAdicional" rows="4"></textarea>

            <button type="submit">Confirmar Reserva</button>
        </form>
    </div>

    <!-- Vínculo con tu archivo de JavaScript -->
    <script src="script.js"></script>
</body>
</html>
